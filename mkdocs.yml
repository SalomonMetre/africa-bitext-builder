site_name: Africa Bitext Builder
site_description: Discovery, licensing verification, and alignment engine for 690+ African language corpora.
site_author: Salomon Metre
repo_url: https://github.com/SalomonMetre/africa-bitext-builder
repo_name: SalomonMetre/africa-bitext-builder

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            heading_level: 2
            members_order: source
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guides:
      - Language & License Discovery: guides/registry.md
      - Compiling Corpora: guides/builder.md
  - API Reference:
      - LanguageRegistry: api/registry.md
      - CorpusBuilder: api/builder.md
